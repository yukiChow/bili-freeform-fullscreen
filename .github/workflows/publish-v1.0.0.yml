name: Publish v1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the first release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" \
            release/Bili-Freeform-Fullscreen-v1.0.0.apk \
            --title "Bili Freeform Fullscreen v1.0.0" \
            --notes "Initial release for Bilibili International 3.20.4 on HyperOS freeform windows."
